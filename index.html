<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEEBE3">
<title>Series 63 Focus Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════
   SERIES 63 PREP — design tokens
   Warm-paper study aesthetic · Plus Jakarta Sans + Lora
════════════════════════════════════════════════════════════ */
:root{
  --paper:  #EEEBE3;
  --paper2: #F6F4EE;
  --paper3: #E4E0D5;
  --card:   #FBFAF7;
  --border: #C9C2B4;
  --ink:    #1C1E26;
  --ink2:   #32343F;
  --ink3:   #6A6D7A;
  --blue:   #2563EB;
  --blue-lt:#EAF0FE;
  --green:  #16A34A;
  --green-lt:#E9F7EE;
  --red:    #DC2626;
  --red-lt: #FDEAEA;
  --amber:  #D97706;
  --amber-lt:#FDF3E3;
  --purple: #7C3AED;

  --sb-bg:    #1E2029;
  --sb2:      #282B36;
  --sb3:      #323645;
  --sb-border:#3A3E4E;
  --sb-txt:   #E6E4DD;
  --sb-dim:   #8A8EA6;

  --r:    13px;
  --r-sm:  8px;
  --fs:   17px;
  --lh:   1.82;
  --ls:   0.01em;
  --sb-w: 272px;
  --cp:   32px;

  --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-serif: 'Lora', Georgia, serif;
}

/* ── ACCESSIBILITY MODES ── */
@font-face{font-family:'OpenDyslexic';src:url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/ttf/OpenDyslexic-Regular.ttf') format('truetype')}
body.dys,body.dys *{font-family:'OpenDyslexic',var(--font-sans)!important}
body.wsp{--ls:0.05em;--lh:2.08;word-spacing:.12em}
body.fsl{--fs:20px} body.fsx{--fs:23px}
body.hic{--paper:#fff;--paper2:#f4f4f4;--paper3:#e2e2e2;--card:#fff;--border:#999;--ink:#000;--ink2:#111;--ink3:#333}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--font-sans);font-size:var(--fs);
  line-height:var(--lh);letter-spacing:var(--ls);
  min-height:100vh;overflow-x:hidden;
}
button{font-family:inherit}
.hidden{display:none!important}
.fa{animation:fa .22s ease}
@keyframes fa{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ════════════════ LAYOUT ════════════════ */
.app{display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);
  background:var(--sb-bg);color:var(--sb-txt);
  display:flex;flex-direction:column;z-index:300;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.sb-head{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sb-brand-eyebrow{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sb-dim)}
.sb-brand{font-family:var(--font-serif);font-size:21px;font-weight:600;color:#fff;line-height:1.2}
.sb-close{display:none;background:var(--sb2);border:none;color:var(--sb-dim);width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer}
.sb-prog{padding:0 20px 14px;flex-shrink:0}
.sb-prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--sb-dim);margin-bottom:5px;font-weight:600}
.prog-track{background:var(--sb2);border-radius:99px;height:5px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#60A5FA);transition:width .5s}
.sb-nav{flex:1;padding:4px 10px 10px}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:9px;cursor:pointer;color:var(--sb-dim);
  font-size:13px;font-weight:600;margin-bottom:2px;
  transition:background .12s,color .12s;border-left:3px solid transparent;
}
.sb-item:hover{background:var(--sb2);color:var(--sb-txt)}
.sb-item.on{background:var(--sb2);color:#fff;border-left-color:var(--blue)}
.sb-ico{font-size:15px;flex-shrink:0;width:20px;text-align:center}
.sb-lbl{flex:1;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;flex-shrink:0}
.bg-g{background:rgba(22,163,74,.22);color:#4ADE80}
.bg-a{background:rgba(217,119,6,.22);color:#FBBF24}
.bg-r{background:rgba(220,38,38,.22);color:#F87171}
.sb-divider{height:1px;background:var(--sb-border);margin:8px 12px}
.sb-foot{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--sb-border);flex-shrink:0}
.sb-foot-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-dim);margin-bottom:8px}
.tog-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:5px}
.tog{padding:7px 4px;background:var(--sb2);border:1px solid var(--sb-border);border-radius:var(--r-sm);color:var(--sb-dim);cursor:pointer;font-size:10px;font-weight:700;text-align:center;transition:all .13s}
.tog:hover{border-color:var(--blue);color:#93B4FD}
.tog.on{background:rgba(37,99,235,.2);border-color:var(--blue);color:#93B4FD}

/* ── VOICE / ELEVENLABS ── */
.vp-wrap{margin-top:10px;border-top:1px solid var(--sb-border);padding-top:10px}
.vp-lbl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-dim);margin-bottom:6px}
.vp-sel{width:100%;background:var(--sb2);border:1px solid var(--sb-border);color:var(--sb-txt);border-radius:var(--r-sm);padding:6px 8px;font-size:11px;font-family:var(--font-sans);cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;margin-bottom:6px}
.vp-key-wrap{position:relative;margin-bottom:6px}
.vp-key{width:100%;background:var(--sb2);border:1px solid var(--sb-border);color:var(--sb-txt);border-radius:var(--r-sm);padding:6px 52px 6px 8px;font-size:11px;font-family:var(--font-sans);outline:none;-webkit-appearance:none}
.vp-key::placeholder{color:var(--sb-dim)}
.vp-key:focus{border-color:var(--blue)}
.vp-key-save{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:var(--blue);border:none;color:#fff;border-radius:5px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer}
.vp-row{display:flex;gap:6px;margin-bottom:4px}
.vp-test{flex:1;background:var(--sb3);border:1px solid var(--sb-border);border-radius:var(--r-sm);color:var(--sb-txt);cursor:pointer;font-size:11px;font-weight:700;padding:6px 0;transition:border-color .13s;text-align:center}
.vp-test:hover,.vp-test.on{border-color:var(--blue);color:#93B4FD}
.vp-clear{background:var(--sb3);border:1px solid var(--sb-border);border-radius:var(--r-sm);color:var(--sb-dim);cursor:pointer;font-size:10px;font-weight:700;padding:6px 9px}
.vp-note{font-size:10px;line-height:1.4;min-height:14px}
.vp-note.ok{color:#4ADE80}.vp-note.warn{color:#FCD34D}.vp-note.dim{color:var(--sb-dim)}

/* ── MAIN PANEL ── */
.main-panel{margin-left:var(--sb-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:200;height:56px;
  background:var(--paper);border-bottom:2px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 16px;
}
.tb-ham{display:none;background:none;border:none;font-size:21px;color:var(--ink);cursor:pointer;padding:4px;line-height:1}
.tb-title{font-family:var(--font-serif);font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tb-tabs{display:flex;gap:5px;flex-shrink:0}
.tbt{padding:6px 13px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--ink3);cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;transition:all .13s}
.tbt.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ── CONTENT ── */
.content-area{flex:1;width:100%;padding:26px var(--cp) 60px;max-width:780px}

/* ════════════════ HOME / DASHBOARD ════════════════ */
.dash-hero{
  background:var(--card);border:2px solid var(--border);border-radius:var(--r);
  padding:20px 22px;margin-bottom:14px;
}
.dash-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dash-eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.dash-h1{font-family:var(--font-serif);font-size:25px;font-weight:600;line-height:1.2}
.dash-sub{font-size:13px;color:var(--ink3);margin-top:4px}
.dash-pills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.dash-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--paper2);border:1.5px solid var(--border);border-radius:10px;
  padding:8px 13px;
}
.dash-pill .n{font-size:21px;font-weight:800;line-height:1}
.dash-pill .l{font-size:10px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.dash-pill.cd-pill{cursor:pointer}
.dash-pill.cd-pill:hover{border-color:var(--blue)}
.streak-flame{font-size:18px}

/* Continue card */
.cont-card{
  display:flex;align-items:center;gap:13px;
  background:var(--blue-lt);border:2px solid var(--blue);border-radius:var(--r);
  padding:14px 16px;margin-bottom:14px;cursor:pointer;
  transition:transform .12s;
}
.cont-card:active{transform:scale(.985)}
.cont-ico{font-size:22px;flex-shrink:0}
.cont-info{flex:1;min-width:0}
.cont-eyebrow{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.cont-title{font-size:14px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont-arrow{font-size:18px;color:var(--blue);flex-shrink:0}

/* Mock exam CTA */
.mock-cta{
  display:flex;align-items:center;gap:13px;
  background:var(--ink);border-radius:var(--r);
  padding:16px;margin-bottom:14px;cursor:pointer;color:var(--paper);
  transition:transform .12s;
}
.mock-cta:active{transform:scale(.985)}
.mock-cta-i
